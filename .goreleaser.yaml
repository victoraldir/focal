# GoReleaser configuration (schema v2) for focal.
# Docs: https://goreleaser.com
#
# Local validation:  goreleaser check
# Local dry run:     goreleaser release --snapshot --clean
version: 2

project_name: focal

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: focal
    main: .
    binary: focal
    env:
      - CGO_ENABLED=0
    # macOS-first: build both Apple Silicon and Intel targets.
    goos:
      - darwin
    goarch:
      - arm64
      - amd64
    # Embed release metadata into the cmd/focal package for `focal version`.
    ldflags:
      - -s -w
      - -X github.com/victoraldir/focal/cmd/focal.version={{ .Version }}
      - -X github.com/victoraldir/focal/cmd/focal.commit={{ .Commit }}
      - -X github.com/victoraldir/focal/cmd/focal.date={{ .Date }}

archives:
  - id: focal
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

# Automatically generate and push a Homebrew formula to the tap repository.
# Make re-running a release for an existing tag idempotent: replace same-named
# assets instead of failing with "already_exists" (422). Without this, a partial
# or repeated release run collides with the assets already on the GitHub release.
release:
  mode: replace

# Generate and push a Homebrew Cask to the tap repository. Casks are the
# non-deprecated GoReleaser path for distributing pre-built binaries (the older
# `brews`/formula generator is deprecated).
homebrew_casks:
  - name: focal
    binaries:
      - focal
    directory: Casks
    homepage: "https://github.com/victoraldir/focal"
    description: "Convert photo sequences into timelapses by wrapping FFmpeg"
    # focal downloads its own static FFmpeg on first use, so ffmpeg is not a
    # hard dependency; this note tells users where that binary lands.
    caveats: |
      focal wraps FFmpeg. If ffmpeg is not already on your PATH, focal downloads
      a static build into ~/Library/Caches/focal/bin on first use.
    # Target tap repository. The release job pushes the generated cask here.
    repository:
      owner: victoraldir
      name: homebrew-tap
      branch: main
      # HOMEBREW_TAP_TOKEN is a PAT with write access to the tap repo,
      # provided by the GitHub Actions workflow.
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    commit_author:
      name: goreleaserbot
      email: goreleaserbot@users.noreply.github.com
    commit_msg_template: "brew cask: focal {{ .Tag }}"
    # The release binary is unsigned, so strip the quarantine attribute Gatekeeper
    # would otherwise apply, letting `focal` run without a security prompt.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/focal"]
          end
