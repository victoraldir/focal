name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Test on macOS and Windows so platform-specific behaviour (path handling,
    # the Windows executable check, and concat-file backslashes) is covered.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      # A single lint pass is enough; run gofmt/vet only on macOS to keep the
      # Windows job focused on catching platform-specific test failures.
      - name: Verify formatting
        if: matrix.os == 'macos-latest'
        run: |
          fmt_out=$(gofmt -l .)
          if [ -n "$fmt_out" ]; then
            echo "These files are not gofmt-clean:"
            echo "$fmt_out"
            exit 1
          fi

      - name: Vet
        if: matrix.os == 'macos-latest'
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test -race -cover ./...
