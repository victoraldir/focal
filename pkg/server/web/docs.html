<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>focal studio · API</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/swagger/swagger-ui.css">
  <link rel="stylesheet" href="/assets/app.css">
  <style>
    body { background: var(--bg); }
    .docs-wrap { background: #fafafa; border-radius: 14px; margin: 0 20px 32px; overflow: hidden; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .information-container { padding-top: 8px; }
    .swagger-ui .info { margin: 28px 0 12px; }
    .swagger-ui .info .title { font-family: var(--font); }
    .swagger-ui .scheme-container { box-shadow: none; border-bottom: 1px solid #e5e5e5; }
    .swagger-ui .opblock-tag { font-family: var(--font); }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true"></span>
      focal <span class="brand-sub">studio</span>
    </a>
    <nav class="nav">
      <a href="/">Studio</a>
      <a href="/docs" class="active">API</a>
    </nav>
    <div class="topbar-right">
      <a class="pill" href="/openapi.yaml" download>openapi.yaml</a>
    </div>
  </header>
  <div class="docs-wrap"><div id="swagger"></div></div>
  <script src="/swagger/swagger-ui-bundle.js"></script>
  <script>
    window.ui = SwaggerUIBundle({
      url: "/openapi.yaml",
      dom_id: "#swagger",
      deepLinking: true,
      docExpansion: "list",
      defaultModelsExpandDepth: 0,
      tryItOutEnabled: true,
      displayRequestDuration: true,
      filter: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
    });
  </script>
</body>
</html>
